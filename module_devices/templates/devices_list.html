{% set fm_page_title = 'All devices' %}
{% set fm_topbar_title = 'All devices' %}
{% include 'partials/dm_shell_start.html' %}

  <header class="fm-header">
    <div>
      <p>Search and filter the IT inventory</p>
    </div>
    <div class="fm-header-actions">
      <a class="fm-btn fm-btn-primary" href="{{ url_for('devices_bp.devices_new_page') }}">Add device</a>
    </div>
  </header>

  <div class="fm-filters">
    <label class="fm-filter-search">
      <span class="fm-filter-search-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.37-4.37"/><circle cx="10.59" cy="10.59" r="7.74"/></svg>
      </span>
      <input type="search" id="q" placeholder="Search name, ID, type, building…" autocomplete="off" enterkeyhint="search">
    </label>
    <select id="status" class="fm-input fm-filter-status" aria-label="Status">
      <option value="">All statuses</option>
      <option value="online">Online</option>
      <option value="idle">Idle</option>
      <option value="offline">Offline</option>
      <option value="update">Needs update</option>
    </select>
    <select id="device_type" class="fm-input fm-filter-status" aria-label="Type">
      <option value="">All types</option>
      <option>Laptop</option>
      <option>Desktop</option>
      <option>Tablet</option>
      <option>Mobile</option>
      <option>Server</option>
      <option>Other</option>
    </select>
    <button type="button" class="fm-btn fm-btn-outline fm-filter-refresh" id="reloadBtn">Refresh</button>
  </div>

  <div class="fm-table-wrap">
    <table class="fm-table fm-table--registry">
      <thead>
        <tr>
          <th>ID</th><th>Name</th><th>Type</th><th>Building</th><th>Status</th><th>Health</th><th>Assigned</th>
        </tr>
      </thead>
      <tbody id="deviceRows"><tr><td colspan="7">Loading…</td></tr></tbody>
    </table>
  </div>

{% set fm_scripts %}
<script>
async function loadDevices() {
  const params = {};
  const q = document.getElementById('q').value.trim();
  const status = document.getElementById('status').value;
  const type = document.getElementById('device_type').value;
  if (q) params.q = q;
  if (status) params.status = status;
  if (type) params.device_type = type;
  const tbody = document.getElementById('deviceRows');
  try {
    const devices = await DM.fetchDevices(params);
    tbody.innerHTML = DM.deviceRowsHtml(devices);
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="7">No devices found</td></tr>';
  }
}
DM.bindTableNav(document.getElementById('deviceRows'));
document.getElementById('reloadBtn').addEventListener('click', loadDevices);
document.getElementById('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') loadDevices(); });
document.getElementById('status').addEventListener('change', loadDevices);
document.getElementById('device_type').addEventListener('change', loadDevices);
(function seed() {
  const params = new URLSearchParams(location.search);
  ['q', 'status', 'device_type'].forEach((key) => {
    const el = document.getElementById(key);
    if (el && params.get(key)) el.value = params.get(key);
  });
})();
loadDevices();
</script>
{% endset %}
{% include 'partials/dm_shell_end.html' %}
