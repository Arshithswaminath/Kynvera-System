<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/design-tokens.css') }}">
  <title>Material Sets — Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/animations.css">
  <link rel="stylesheet" href="/static/css/dashboard.css">
  <link rel="stylesheet" href="/static/mobile_responsive.css">
  <link rel="stylesheet" href="/static/css/store.css">
  <style>
    .sets-body { max-width: 1100px; margin: 0 auto; padding: 2rem 2.5rem 4rem; }
    .set-card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; background: #fff; }
    .set-card h3 { font-size: 1rem; font-weight: 700; margin: 0 0 4px; }
    .set-meta { font-size: .8rem; color: #64748b; }
    .set-items { font-size: .82rem; color: #334155; margin-top: 8px; }
    .create-box { border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-bottom: 1.25rem; background: #f8fafc; }
    @media (max-width: 768px) { .sets-body { padding: 1.5rem 1rem 3rem; } }
  </style>
</head>
<body class="has-main-nav proc-subpage">
  {% set active_page = 'store' %}
  {% include 'partials/main_navbar.html' with context %}

  <header class="proc-subhero">
    <div class="proc-subhero-inner">
      <div>
        <a href="/store/" class="back-link">
          <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          Back to Store
        </a>
        <h1 class="proc-subhero-title">Material Sets</h1>
        <p class="proc-subhero-sub">Bundles that expand onto service tickets in one click</p>
      </div>
      <div class="proc-subhero-actions">
        <button type="button" class="btn-proc btn-proc-ghost" id="dlTemplateBtn">Download template</button>
        <label class="btn-proc btn-proc-light" style="cursor:pointer;margin:0;">
          Import Excel
          <input type="file" id="importFile" accept=".xlsx,.xls" hidden>
        </label>
      </div>
    </div>
  </header>

  <div class="sets-body">
    <div class="create-box">
      <div class="row g-2 align-items-end">
        <div class="col-md-4">
          <label class="form-label">Set name</label>
          <input class="form-control" id="newSetName" placeholder="e.g. Sprinkler Set A">
        </div>
        <div class="col-md-3">
          <label class="form-label">Type</label>
          <input class="form-control" id="newSetType" placeholder="Fire / MEP…">
        </div>
        <div class="col-md-5">
          <label class="form-label">First item (name | qty | unit | price)</label>
          <input class="form-control" id="newSetItem" placeholder="Sprinkler head | 5 | pcs | 12.5">
        </div>
      </div>
      <div class="mt-3 d-flex justify-content-end">
        <button type="button" class="btn-proc btn-proc-light" id="createSetBtn">Create set</button>
      </div>
    </div>

    <div id="setsList"><div class="text-muted">Loading…</div></div>
  </div>

  <script src="{{ url_for('static', filename='js/store-common.js') }}"></script>
  <script>
    const token = localStorage.getItem('access_token');
    async function api(url, opts = {}) {
      const headers = Object.assign({ 'Authorization': 'Bearer ' + token }, opts.headers || {});
      if (opts.json) {
        headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(opts.json);
        delete opts.json;
      }
      const res = await fetch(url, Object.assign({}, opts, { headers }));
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, data };
    }

    function parseItemLine(raw) {
      const parts = (raw || '').split('|').map(s => s.trim());
      if (!parts[0]) return null;
      return {
        material_name: parts[0],
        quantity: parseFloat(parts[1] || '1') || 1,
        unit: parts[2] || '',
        unit_price: parseFloat(parts[3] || '0') || 0,
      };
    }

    async function loadSets() {
      const box = document.getElementById('setsList');
      const res = await api('/store/api/sets');
      const sets = (res.ok && res.data.sets) ? res.data.sets : [];
      const seePrice = !!(res.data && res.data.can_see_prices);
      if (!sets.length) {
        box.innerHTML = '<div class="text-muted">No sets yet. Create one or import the Excel template.</div>';
        return;
      }
      box.innerHTML = sets.map(s => {
        const items = (s.items || []).map(i => {
          const price = seePrice && i.unit_price != null ? ` @ AED ${Number(i.unit_price).toFixed(2)}` : '';
          return `${i.material_name} × ${i.quantity || 1}${i.unit ? ' ' + i.unit : ''}${price}`;
        }).join('; ');
        return `<div class="set-card">
          <h3>${s.name}</h3>
          <div class="set-meta">${s.set_id}${s.material_type ? ' · ' + s.material_type : ''} · ${s.item_count || 0} items</div>
          <div class="set-items">${items || 'No items'}</div>
        </div>`;
      }).join('');
    }

    document.getElementById('dlTemplateBtn').addEventListener('click', async () => {
      const res = await fetch('/store/api/sets/template', {
        headers: { 'Authorization': 'Bearer ' + token },
      });
      if (!res.ok) { alert('Template download failed'); return; }
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'material_sets_template.xlsx';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    document.getElementById('createSetBtn').addEventListener('click', async () => {
      const name = document.getElementById('newSetName').value.trim();
      if (!name) { alert('Set name required'); return; }
      const item = parseItemLine(document.getElementById('newSetItem').value);
      const res = await api('/store/api/sets', {
        method: 'POST',
        json: {
          name,
          material_type: document.getElementById('newSetType').value.trim(),
          items: item ? [item] : [],
        },
      });
      if (res.ok && res.data.success) {
        document.getElementById('newSetName').value = '';
        document.getElementById('newSetItem').value = '';
        loadSets();
      } else {
        alert((res.data && res.data.error) || 'Create failed');
      }
    });

    document.getElementById('importFile').addEventListener('change', async (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const fd = new FormData();
      fd.append('file', f);
      const res = await fetch('/store/api/sets/import', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token },
        body: fd,
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.success) {
        alert(data.message || 'Imported');
        loadSets();
      } else {
        alert(data.error || 'Import failed');
      }
      e.target.value = '';
    });

    loadSets();
  </script>
</body>
</html>
