<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/design-tokens.css') }}">
<title>Materials List — Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/animations.css">
  <link rel="stylesheet" href="/static/css/dashboard.css">
  <link rel="stylesheet" href="/static/mobile_responsive.css">
  <link rel="stylesheet" href="/static/css/store.css">
  <style>
    .mats-body { max-width: 1400px; margin: 0 auto; padding: 2rem 2.5rem 4rem; }
    @media (max-width: 768px) { .mats-body { padding: 1.5rem 1rem 3rem; } }
  </style>
</head>
<body class="has-main-nav proc-subpage">
  {% set active_page = 'store' %}
  {% include 'partials/main_navbar.html' with context %}

  <!-- Hero -->
  <header class="proc-subhero">
    <div class="proc-subhero-inner">
      <div>
        <a href="/store/" class="back-link">
          <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          Back to Store
        </a>
        <h1 class="proc-subhero-title">All Materials</h1>
        <p class="proc-subhero-sub">Complete catalog across fire &amp; life-safety departments</p>
      </div>
      <div class="proc-subhero-actions">
        <button class="btn-proc btn-proc-ghost" onclick="window.open('/store/api/export-excel','_blank')">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          Export Excel
        </button>
        <a href="/store/add-material" class="btn-proc btn-proc-light">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
          Add Material
        </a>
      </div>
    </div>
  </header>

  <!-- Body -->
  <div class="mats-body">
    <!-- Toolbar -->
    <div class="proc-toolbar">
      <div class="proc-search-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="proc-search" id="searchInput" placeholder="Search by name or brand…" oninput="filterMaterials()">
      </div>
      <select class="proc-filter-select" id="deptFilter" onchange="filterMaterials()">
        <option value="">All Departments</option>
        <option value="Fire Alarm">Fire Alarm</option>
        <option value="Fire Suppression">Fire Suppression</option>
        <option value="Fire Safety">Fire Safety</option>
        <option value="Emergency">Emergency</option>
      </select>
      <span class="proc-count-badge proc-toolbar-spacer" id="countBadge">Loading…</span>
    </div>

    <!-- Table -->
    <div class="proc-table-card">
      <div class="table-responsive">
        <table class="proc-table proc-table-responsive-cards">
          <thead>
            <tr>
              <th style="width:38px">#</th>
              <th>Material</th>
              <th>Brand</th>
              <th>Department</th>
              <th>UOM</th>
              <th>Unit Price (AED)</th>
            </tr>
          </thead>
          <tbody id="materialsBody">
            <tr><td colspan="6"><div class="proc-empty" style="padding:2.5rem 1rem;"><div class="spinner-border spinner-border-sm text-secondary mb-2"></div><div>Loading materials…</div></div></td></tr>
          </tbody>
        </table>
      </div>
      <div class="proc-pag" id="paginationBar" style="display:none">
        <div class="proc-pag-info" id="pagInfo"></div>
        <div class="proc-pag-btns" id="pagBtns"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/store-common.js') }}"></script>
  <script>
    const token = localStorage.getItem('access_token');
    let allMaterials = [];
    let filteredMaterials = [];
    const perPage = 25;
    let currentPage = 1;

    const DEPT_STYLE = {
      'Fire Alarm':       'tag-fire-alarm',
      'Fire Suppression': 'tag-fire-suppression',
      'Fire Safety':      'tag-fire-safety',
      'Emergency':        'tag-emergency',
    };
    function deptBadge(dept) {
      const cls = DEPT_STYLE[dept] || 'tag-general';
      return `<span class="proc-tag ${cls}"><span class="dot"></span>${ProcCommon.esc(dept || 'General')}</span>`;
    }

    async function loadMaterials() {
      try {
        const resp = await fetch('/store/api/catalog/materials', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await resp.json();
        if (!data.materials) throw new Error(data.error || 'No data');

        allMaterials = [];
        const depts = ['Fire Alarm', 'Fire Suppression', 'Fire Safety', 'Emergency'];
        depts.forEach(dept => {
          (data.materials[dept] || []).forEach(item => {
            allMaterials.push({ ...item, department: dept });
          });
        });

        filteredMaterials = [...allMaterials];
        renderTable();
      } catch (error) {
        document.getElementById('materialsBody').innerHTML =
          `<tr><td colspan="6" class="text-danger" style="padding:2rem 1rem;text-align:center;">Error loading materials: ${ProcCommon.esc(error.message)}</td></tr>`;
      }
    }

    function filterMaterials() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const dept   = document.getElementById('deptFilter').value;
      filteredMaterials = allMaterials.filter(m => {
        const matchSearch = !search ||
          (m.name  || '').toLowerCase().includes(search) ||
          (m.brand || '').toLowerCase().includes(search);
        const matchDept = !dept || m.department === dept;
        return matchSearch && matchDept;
      });
      currentPage = 1;
      renderTable();
    }

    function renderTable() {
      const start    = (currentPage - 1) * perPage;
      const pageData = filteredMaterials.slice(start, start + perPage);
      const tbody    = document.getElementById('materialsBody');
      const esc = ProcCommon.esc;
      document.getElementById('countBadge').textContent =
        filteredMaterials.length.toLocaleString() + ' material' + (filteredMaterials.length !== 1 ? 's' : '');

      if (pageData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6"><div class="proc-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <div class="proc-empty-title">No materials match your search</div>
        </div></td></tr>`;
        document.getElementById('paginationBar').style.display = 'none';
        return;
      }

      tbody.innerHTML = pageData.map((m, i) => {
        const price = parseFloat(m.unit_price) || 0;
        return `<tr>
          <td class="proc-sno" data-label="#">${start + i + 1}</td>
          <td class="proc-mat-name" data-label="Material">${esc(m.name)}</td>
          <td data-label="Brand" style="color:var(--proc-muted)">${esc(m.brand || '—')}</td>
          <td data-label="Dept">${deptBadge(m.department)}</td>
          <td data-label="UOM" style="color:var(--proc-muted)">${esc(m.uom || 'PCS')}</td>
          <td data-label="Price" class="proc-price">${price > 0 ? 'AED ' + price.toLocaleString('en-AE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '<span class="proc-price-na">—</span>'}</td>
        </tr>`;
      }).join('');

      const totalPages = Math.ceil(filteredMaterials.length / perPage);
      const bar = document.getElementById('paginationBar');
      bar.style.display = totalPages > 1 ? 'flex' : 'none';
      document.getElementById('pagInfo').textContent =
        `Showing ${start + 1}–${Math.min(start + perPage, filteredMaterials.length)} of ${filteredMaterials.length.toLocaleString()}`;

      let btns = '';
      for (let p = 1; p <= totalPages; p++) {
        if (p === 1 || p === totalPages || Math.abs(p - currentPage) <= 2) {
          btns += `<button class="proc-pag-btn${p === currentPage ? ' active' : ''}" onclick="goPage(${p})">${p}</button>`;
        } else if (!btns.endsWith('…</span>')) {
          btns += `<span style="padding:0 4px;color:#94a3b8;line-height:32px">…</span>`;
        }
      }
      document.getElementById('pagBtns').innerHTML = btns;
    }

    function goPage(p) { currentPage = p; renderTable(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

    loadMaterials();
  </script>
</body>
</html>
