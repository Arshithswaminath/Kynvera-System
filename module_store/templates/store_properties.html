<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/design-tokens.css') }}">
<title>Properties — Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/animations.css">
  <link rel="stylesheet" href="/static/css/dashboard.css">
  <link rel="stylesheet" href="/static/mobile_responsive.css">
  <link rel="stylesheet" href="/static/css/store.css">
  <style>
    .props-body { max-width: 1400px; margin: 2.25rem auto; padding: 0 2rem; }
    @media (max-width: 768px) { .props-body { margin: 1.5rem auto; padding: 0 1rem; } }
    .props-loading, .props-empty { text-align: center; padding: 5rem 2rem; color: var(--proc-muted); }
    .props-empty svg { width: 80px; height: 80px; stroke: #cbd5e1; margin-bottom: 1.25rem; }
  </style>
</head>
<body class="has-main-nav proc-subpage">
  {% set active_page = 'store' %}
  {% include 'partials/main_navbar.html' with context %}

  <!-- Hero -->
  <header class="proc-subhero">
    <div class="proc-subhero-inner">
      <div>
        <a href="/store/" class="back-link">
          <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          Back to Store
        </a>
        <h1 class="proc-subhero-title">Property Management</h1>
        <p class="proc-subhero-sub">Organize and track materials by site or location</p>
      </div>
      <div class="proc-subhero-actions">
        <button class="btn-proc btn-proc-light" onclick="showAddPropertyModal()">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
          Add Property
        </button>
      </div>
    </div>
  </header>

  <!-- Content -->
  <div class="props-body">
    <div id="propertiesContainer">
      <div class="props-loading">
        <div class="spinner-border text-secondary mb-3"></div>
        <p>Loading properties…</p>
      </div>
    </div>
  </div>

  <!-- Add Property Modal -->
  <div class="modal fade proc-modal" id="addPropertyModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add New Property</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Property Name *</label>
            <input type="text" class="form-control" id="propertyName" placeholder="e.g., Tower A, Villa 12, Site B">
          </div>
          <div class="mb-3">
            <label class="form-label">Address</label>
            <input type="text" class="form-control" id="propertyAddress" placeholder="Full address (optional)">
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" id="propertyDescription" rows="2" placeholder="Brief description (optional)"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal" style="border-radius:10px;font-weight:600;">Cancel</button>
          <button type="button" class="btn-proc btn-proc-primary" onclick="addProperty()">Add Property</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/store-common.js') }}"></script>
  <script>
    const token = localStorage.getItem('access_token');

    async function loadProperties() {
      try {
        const response = await fetch('/store/api/properties', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();
        const container = document.getElementById('propertiesContainer');

        if (data.properties && data.properties.length > 0) {
          const sorted = data.properties.sort((a,b) => {
            if (a.name === 'Unassigned') return 1;
            if (b.name === 'Unassigned') return -1;
            return b.materials_count - a.materials_count;
          });

          let html = '<div class="proc-card-grid cols-auto">';
          sorted.forEach((prop) => {
            const isUnassigned = prop.name === 'Unassigned';
            const acc = ProcCommon.propertyAccent(prop.name);
            const icon = ProcCommon.propertyIconSvg(prop.name);
            const valK = prop.total_value >= 1000
              ? (prop.total_value / 1000).toFixed(1) + 'K'
              : (prop.total_value || 0).toFixed(0);

            html += `
              <a href="/store/property/${encodeURIComponent(prop.name)}" class="proc-card" style="--proc-accent:${acc.accent};--proc-accent-dark:${acc.dark};">
                <div class="proc-card-top" style="min-height:auto;padding-bottom:1.1rem;">
                  <span class="proc-card-badge">${isUnassigned ? 'Unassigned' : 'Property'}</span>
                  <div class="proc-card-icon">${icon}</div>
                  <div class="proc-card-name">${ProcCommon.esc(prop.name)}</div>
                </div>
                <div class="proc-card-body">
                  <div class="proc-card-stats">
                    <div class="proc-card-stat">
                      <div class="proc-card-stat-val">${prop.materials_count}</div>
                      <div class="proc-card-stat-lbl">Materials</div>
                    </div>
                    <div class="proc-card-stat">
                      <div class="proc-card-stat-val">${Math.round(prop.total_quantity || 0).toLocaleString()}</div>
                      <div class="proc-card-stat-lbl">Items</div>
                    </div>
                    <div class="proc-card-stat">
                      <div class="proc-card-stat-val">${valK}</div>
                      <div class="proc-card-stat-lbl">AED Value</div>
                    </div>
                  </div>
                </div>
                <div class="proc-card-bottom">
                  <span class="proc-card-count" style="font-size:.78rem;">${isUnassigned ? 'Needs assignment' : 'Click to view'}</span>
                  <div class="proc-card-arr">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg>
                  </div>
                </div>
              </a>`;
          });

          html += `
            <div class="proc-add-card" onclick="showAddPropertyModal()">
              <div class="proc-add-card-icon"><svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg></div>
              <div class="proc-add-card-label">Add New Property</div>
              <div class="proc-add-card-sub">Create a new site or location</div>
            </div>
          </div>`;

          container.innerHTML = html;
        } else {
          container.innerHTML = `
            <div class="props-empty">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
              </svg>
              <h4 style="font-weight:700;margin-bottom:.5rem;">No Properties Yet</h4>
              <p class="text-muted mb-4">Create your first property to organize materials by location</p>
              <button class="btn-proc btn-proc-primary" onclick="showAddPropertyModal()">Add First Property</button>
            </div>`;
        }
      } catch (error) {
        document.getElementById('propertiesContainer').innerHTML = '<div class="alert alert-danger m-3">Error loading properties</div>';
      }
    }

    function showAddPropertyModal() {
      new bootstrap.Modal(document.getElementById('addPropertyModal')).show();
    }

    async function addProperty() {
      const name        = document.getElementById('propertyName').value.trim();
      const address     = document.getElementById('propertyAddress').value.trim();
      const description = document.getElementById('propertyDescription').value.trim();
      if (!name) { alert('Property name is required'); return; }
      try {
        const response = await fetch('/store/api/properties', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ name, address, description })
        });
        const result = await response.json();
        if (result.success) {
          bootstrap.Modal.getInstance(document.getElementById('addPropertyModal')).hide();
          document.getElementById('propertyName').value        = '';
          document.getElementById('propertyAddress').value    = '';
          document.getElementById('propertyDescription').value = '';
          loadProperties();
        } else { alert('Error: ' + result.error); }
      } catch (error) { alert('Error: ' + error.message); }
    }

    loadProperties();
  </script>
</body>
</html>
