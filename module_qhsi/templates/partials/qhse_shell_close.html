      </div>
    </div>
  </div>
</div>
<button type="button" class="dh-sidebar-toggle" id="qhseDhSidebarToggle"
        onclick="qhseToggleMobileSidebar()" aria-label="Open QHSE menu" title="Menu">&#9776;</button>
{% include 'partials/module_nav_footer_scripts.html' %}
<script>
  function qhseOpenMobileSidebar() {
    var s = document.getElementById('qhseDhSidebar');
    var o = document.getElementById('qhseDhOverlay');
    if (s) s.classList.add('open');
    if (o) { o.classList.add('active'); o.setAttribute('aria-hidden', 'false'); }
  }
  function qhseCloseMobileSidebar() {
    var s = document.getElementById('qhseDhSidebar');
    var o = document.getElementById('qhseDhOverlay');
    if (s) s.classList.remove('open');
    if (o) { o.classList.remove('active'); o.setAttribute('aria-hidden', 'true'); }
  }
  function qhseToggleMobileSidebar() {
    var s = document.getElementById('qhseDhSidebar');
    if (!s) return;
    s.classList.contains('open') ? qhseCloseMobileSidebar() : qhseOpenMobileSidebar();
  }
</script>
</body>
