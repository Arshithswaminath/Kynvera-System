<div class="el-modal" id="efhPromoteModal" hidden>
  <div class="el-modal-backdrop" data-close-efh-promote></div>
  <div class="el-modal-card el-form-card" role="dialog" aria-modal="true" aria-labelledby="efhPromoteTitle">
    <button type="button" class="el-modal-close" data-close-efh-promote title="Close" aria-label="Close">&times;</button>
    <h2 id="efhPromoteTitle">Move to Employee List</h2>
    <p class="el-form-hint" id="efhPromoteHint">Add this person to the general Employee List? Emp ID and full name are required.</p>
    <form id="efhPromoteForm">
      <input type="hidden" id="efhPromoteCandidateId" value="">
      <div class="el-field-row">
        <label class="el-field">
          <span>Emp ID <span class="el-required">required</span></span>
          <input type="text" id="efhPromoteEmpId" required maxlength="40" placeholder="INJ-0042" autocomplete="off">
        </label>
        <label class="el-field">
          <span>Company</span>
          <input type="text" id="efhPromoteCompany" required maxlength="40"
            placeholder="Company" value="Kynvera" autocomplete="off">
        </label>
      </div>
      <label class="el-field">
        <span>Full name <span class="el-required">required</span></span>
        <input type="text" id="efhPromoteName" required maxlength="200" placeholder="Full name" autocomplete="name">
      </label>
      <label class="el-field">
        <span>Designation</span>
        <input type="text" id="efhPromoteDesig" maxlength="160" placeholder="Optional">
      </label>
      <div class="el-modal-actions el-form-actions">
        <button type="button" class="hh-btn hh-btn-secondary" data-close-efh-promote>Cancel</button>
        <button type="submit" class="hh-btn hh-btn-primary" id="efhPromoteSubmit">Move to Employee List</button>
      </div>
    </form>
  </div>
</div>

<div class="el-modal" id="efhDismissModal" hidden>
  <div class="el-modal-backdrop" data-close-efh-dismiss></div>
  <div class="el-modal-card el-form-card" role="dialog" aria-modal="true" aria-labelledby="efhDismissTitle">
    <button type="button" class="el-modal-close" data-close-efh-dismiss title="Close" aria-label="Close">&times;</button>
    <h2 id="efhDismissTitle">Already on Employee List</h2>
    <p class="el-form-hint" id="efhDismissCopy">This person looks similar to someone on the staff list. Merge into one record, or create a new one?</p>
    <p class="el-modal-id" id="efhDismissEmpId">—</p>
    <p class="el-form-hint" id="efhDismissNames"></p>
    <div class="el-modal-actions el-form-actions">
      <button type="button" class="hh-btn hh-btn-secondary" data-close-efh-dismiss>Keep</button>
      <button type="button" class="hh-btn hh-btn-secondary" id="efhDismissCreate">Create new</button>
      <button type="button" class="hh-btn hh-btn-primary" id="efhDismissConfirm">Merge</button>
    </div>
  </div>
</div>
