<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/design-tokens.css') }}">
  <title>HR form sign-off — Kynvera</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}?v=22">
  <link rel="stylesheet" href="{{ url_for('static', filename='mobile_responsive.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <style>
    .rsp-page {
      padding: 5.75rem clamp(0.65rem, 1.25vw, 1.5rem) 2rem;
      width: 100%;
      max-width: none;
      margin: 0;
      box-sizing: border-box;
    }
    .rsp-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, min(36vw, 36rem));
      gap: clamp(0.75rem, 1.5vw, 1.75rem);
      align-items: start;
      width: 100%;
    }
    @media (max-width: 960px) {
      .rsp-layout { grid-template-columns: 1fr; }
      .rsp-sign-col { position: relative !important; top: auto !important; max-height: none !important; overflow-y: visible !important; }
      .rsp-preview-col .rsp-preview-scroll { max-height: min(52vh, 560px); }
    }
    .rsp-preview-col {
      min-width: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .rsp-preview-caption {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--pri, #ff8e68);
      margin: 0;
    }
    .rsp-preview-scroll {
      max-height: calc(100vh - 7.25rem);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--ios-grouped, #f5f5f7);
      border-radius: 0;
      border: none;
      box-shadow: none;
      scrollbar-width: thin;
      scrollbar-color: rgba(100, 116, 139, 0.42) transparent;
    }
    .rsp-preview-scroll::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .rsp-preview-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .rsp-preview-scroll::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.35);
      border-radius: 999px;
    }
    .rsp-preview-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(71, 85, 105, 0.55);
    }
    .rsp-pdf-host { width: 100%; }
    .rsp-pdf-host:not([hidden]) { min-height: 10rem; }
    .rsp-pdf-pages {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 0.25rem 0 1rem;
      box-sizing: border-box;
      align-items: center;
    }
    .rsp-pdf-page {
      width: auto;
      max-width: min(820px, 100%);
      background: transparent;
      border-radius: 0;
      box-shadow: none;
      overflow: visible;
      line-height: 0;
    }
    .rsp-pdf-page canvas {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      vertical-align: top;
    }
    .rsp-preview-zoom-fallback {
      width: 100%;
      box-sizing: border-box;
    }
    .rsp-preview-zoom-fallback #rspPreviewFrame {
      width: 100%;
      min-height: 36rem;
      height: calc(100vh - 8rem);
      border: none;
      display: block;
      background: var(--ios-grouped, #f5f5f7);
    }
    .rsp-preview-loading,
    .rsp-preview-fallback {
      padding: 1.25rem 1rem;
      text-align: center;
      font-size: 0.88rem;
      color: #64748b;
    }
    .rsp-preview-fallback { color: #475569; line-height: 1.5; }
    .rsp-sign-col {
      position: sticky;
      top: 5.5rem;
      max-height: calc(100vh - 6rem);
      overflow-y: auto;
      min-width: 0;
      width: 100%;
      scrollbar-width: thin;
      scrollbar-color: rgba(100, 116, 139, 0.42) transparent;
    }
    .rsp-sign-col::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .rsp-sign-col::-webkit-scrollbar-track {
      background: transparent;
    }
    .rsp-sign-col::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.35);
      border-radius: 999px;
    }
    .rsp-sign-col::-webkit-scrollbar-thumb:hover {
      background: rgba(71, 85, 105, 0.55);
    }
    .rsp-card {
      background: #fff;
      border-radius: 14px;
      border: 1px solid rgba(226,232,240,1);
      box-shadow: 0 8px 30px rgba(15,23,42,0.06);
      padding: 1.25rem 1.35rem 1.4rem;
      width: 100%;
      box-sizing: border-box;
    }
    .rsp-card h1 { font-size: 1.28rem; margin: 0 0 .35rem; color: var(--pri-d, #0f172a); }
    .rsp-meta { font-size: 0.86rem; color: #64748b; margin: 0 0 1rem; line-height: 1.45; }
    .sig-canvas-box { position:relative; border-radius:12px; border:1.5px solid #e5e9ef; background:#fafafa; overflow:hidden;}
    canvas#rspSig { display:block; width:100%; height:200px; touch-action:none;}
    .sig-guide { pointer-events:none; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:0.82rem;}
    .rsp-actions { display:flex; gap:0.65rem; margin-top:0.95rem; flex-wrap: wrap; align-items:center; }
    .rsp-err { color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;padding:.65rem .8rem;border-radius:10px;font-size:.86rem;display:none;margin-top:.85rem;}
    textarea.fld-inp { width:100%; min-height:72px; border-radius:12px; border:1.5px solid #e5e9ef; padding:.55rem .65rem; font-family:inherit;}
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/hr-forms-unified.css') }}">
</head>
<body class="hr-form-unified">
  {% set active_page = 'hr' %}
  {% include 'partials/hr_embed_optional_navbar.html' %}
  <div class="rsp-page">
    <a href="/hr/my-requests" class="back-btn" style="margin-bottom:1rem;display:inline-flex;align-items:center;gap:.4rem;"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg> Back</a>

    <div class="rsp-layout">
      <div class="rsp-preview-col">
        <p class="rsp-preview-caption">Submitted form</p>
        <div class="rsp-preview-scroll" id="rspPreviewScroll">
          <div class="rsp-preview-loading" id="rspPreviewLoading">Loading form preview…</div>
          <div id="rspPreviewPdfHost" class="rsp-pdf-host" hidden></div>
          <div id="rspPreviewZoomWrap" class="rsp-preview-zoom-wrap rsp-preview-zoom-fallback" style="display:none">
            <iframe id="rspPreviewFrame" title="Submitted HR form PDF"></iframe>
          </div>
          <div class="rsp-preview-fallback" id="rspPreviewErr" style="display:none;"></div>
        </div>
      </div>

      <div class="rsp-sign-col">
        <div class="rsp-card">
          <h1 id="rspTitle">HR form sign-off</h1>
          <p class="rsp-meta" id="rspMeta">Loading…</p>
          <p id="rspNote" style="display:none;font-size:.84rem;color:#64748b;margin:0 0 .75rem"></p>

          <label class="fld-lbl">Comments <span style="opacity:.65">(optional)</span></label>
          <textarea class="fld-inp" id="rspComments" data-approval-comment placeholder="Add notes for the next reviewer…"></textarea>

          <div id="rspNextApproverBlock" style="display:none;margin-top:1rem;padding-top:.85rem;border-top:1px solid rgba(226,232,240,.9)">
            <label class="fld-lbl">Forward for approval to <span class="req">*</span></label>
            <p style="font-size:.78rem;color:#64748b;margin:.35rem 0 .5rem;line-height:1.4">Choose who should review this form next. After they sign, it goes to the General Manager and HR.</p>
            <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:flex-end;margin-top:.35rem">
              <select class="fld-inp" id="rspNextApproverSel" style="flex:1;min-width:11rem"><option value="">Loading…</option></select>
              <button type="button" class="btn-ghost" id="rspNextApproverAdd">Add</button>
            </div>
            <div id="rspNextApproverChips" style="margin-top:.35rem;display:flex;flex-wrap:wrap;gap:.2rem"></div>
          </div>

          <p class="fld-lbl" style="margin-top:1rem;"><strong>Signature</strong> <span class="req">*</span></p>
          <div class="sig-canvas-box" style="margin-top:.35rem;">
            <canvas id="rspSig"></canvas>
            <span class="sig-guide" id="rspGuide">Sign here</span>
          </div>
          <div class="rsp-actions">
            <button type="button" class="btn-ghost" id="rspClear">Clear</button>
            <button type="button" class="btn-pri" id="rspSubmit">Submit signature</button>
          </div>
          <div class="rsp-err" id="rspErr"></div>
        </div>
      </div>
    </div>
  </div>

<script src="{{ url_for('static', filename='js/approval_comment.js') }}"></script>
<script src="{{ url_for('static', filename='js/hr_sign_pdf_preview.js') }}"></script>
<script src="{{ url_for('static', filename='js/hr_center_notice_modal.js') }}"></script>
<script src="{{ url_for('static', filename='js/hr_colleague_slot_picker.js') }}?v=2"></script>
<script>
const SUBMISSION_ID = {{ submission_id | tojson }};
const TOKEN = localStorage.getItem('access_token');
let pad = null;
let pdfPreviewLoadGen = 0;
let requiresNextApprover = false;
const next_approver_signer_ids = [];

window.addEventListener('beforeunload', function () {
  try { HrSignPdfPreview.revokeBlob(); } catch (e) {}
});

async function loadSubmittedFormPdfPreview(){
  const gen = ++pdfPreviewLoadGen;
  await HrSignPdfPreview.load({
    submissionId: SUBMISSION_ID,
    token: TOKEN,
    gen: gen,
    isStale: function (g) { return g !== pdfPreviewLoadGen; },
    errMessage: 'Could not load the submitted form as PDF. You can still complete your signature below, or open the request from My Requests after signing if your role allows.',
  });
}

function resizeCanvas(){
  const c = document.getElementById('rspSig');
  if (!c || !SignaturePad) return;
  const r = Math.max(window.devicePixelRatio || 1, 1);
  const w = c.parentElement.clientWidth || 560;
  c.width = Math.floor(w * r);
  c.height = Math.floor(200 * r);
  c.getContext('2d').scale(r, r);

  const hadPad = !!pad;
  if (hadPad){ try { pad.off(); } catch(e){} pad = null; }

  pad = new SignaturePad(c, {
    backgroundColor: 'rgb(250,250,250)',
    penColor:'#0d1f14',
    minWidth:1.15,
    maxWidth:2.65,
  });

  hideGuide();

  pad.addEventListener?.('afterUpdateStroke', hideGuide);

  pad.addEventListener?.('beginStroke', hideGuide);
}

function hideGuide(){
  const g = document.getElementById('rspGuide');
  if(!g) return;
  g.style.opacity = (pad && !pad.isEmpty()) ? '0' : '1';
}

async function loadUserDefaults() {
  if (!TOKEN) return;
  try {
    const response = await fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + TOKEN } });
    if (!response.ok) return;
    const data = await response.json();
    if (data.user && window.InjaazApprovalComment) {
      window.InjaazApprovalComment.setUserContext(data.user);
    }
  } catch (_e) { /* ignore */ }
}

function prefillSignComment() {
  const el = document.getElementById('rspComments');
  if (!el || el.value.trim()) return;
  const text = window.InjaazApprovalComment
    ? window.InjaazApprovalComment.resolveDefaultApprovalComment()
    : '';
  if (text) el.value = text;
  if (window.InjaazApprovalComment) window.InjaazApprovalComment.bindCommentField(el);
}

async function boot(){
  if (!TOKEN){ window.location.href = '/login'; return; }

  document.getElementById('rspMeta').textContent = 'Reference: '+SUBMISSION_ID;

  resizeCanvas();

  window.addEventListener('resize', ()=>{ resizeCanvas(); });

  void loadSubmittedFormPdfPreview();
  await loadUserDefaults();

  const res = await fetch('/hr/api/replacement-signoff-detail/'+encodeURIComponent(SUBMISSION_ID), {
    headers: { 'Authorization':'Bearer '+TOKEN }
  });
  const j = await res.json().catch(()=>({}));
  if(!res.ok || !j.success){
    pdfPreviewLoadGen += 1;
    HrSignPdfPreview.abort();
    document.getElementById('rspErr').style.display = 'block';
    document.getElementById('rspErr').textContent = j.error || 'Could not load this form.';
    document.getElementById('rspSubmit').disabled = true;
    const errLeft = document.getElementById('rspPreviewErr');
    const loadLeft = document.getElementById('rspPreviewLoading');
    if (loadLeft) loadLeft.style.display = 'none';
    if (errLeft) {
      errLeft.style.display = 'block';
      errLeft.textContent = j.error || 'Could not load this submission.';
    }
    return;
  }

  const sub = j.submission;
  const fd = sub.form_data || {};
  document.getElementById('rspTitle').textContent = j.form_type_display || 'HR form';

  const subName = fd.submitted_by_name || '';
  const slotLabel = (j.pending_slot_label || '').trim();
  const slotPart = slotLabel
    ? '<br><span style="color:#475569">Your role: <strong>'+escapeHtml(slotLabel)+'</strong></span>'
    : '';

  document.getElementById('rspMeta').innerHTML =
    '<strong>'+escapeHtml(subName)+'</strong> asked you to sign an HR form.'+slotPart+
    '<br>Ref: <code>'+escapeHtml(SUBMISSION_ID)+'</code>';

  if (!j.can_sign){
    document.getElementById('rspNote').style.display = 'block';
    document.getElementById('rspNote').textContent =
      'You cannot sign here (either you already signed or you are not a designated replacement for this submission).';
    document.getElementById('rspSubmit').disabled = true;
    pad && pad.off();
    return;
  }

  requiresNextApprover = !!j.requires_next_approver;
  if (requiresNextApprover) {
    document.getElementById('rspNextApproverBlock').style.display = 'block';
    if (window.HrColleagueSlotPicker) {
      HrColleagueSlotPicker.bind({
        selectId: 'rspNextApproverSel',
        addBtnId: 'rspNextApproverAdd',
        chipsId: 'rspNextApproverChips',
        ids: next_approver_signer_ids,
        multi: false,
      });
    }
  }

  prefillSignComment();

  document.getElementById('rspClear').addEventListener('click', ()=>{
    if(pad) pad.clear();
    hideGuide();
  });

  document.getElementById('rspSubmit').addEventListener('click', submitSig);
}

function escapeHtml(s){
  const d=document.createElement('div'); d.textContent = s||''; return d.innerHTML;
}

async function submitSig(){
  const err = document.getElementById('rspErr');
  err.style.display = 'none';
  if(!pad || pad.isEmpty()){
    err.textContent='Please draw your signature.';
    err.style.display='block';
    return;
  }
  if (requiresNextApprover && next_approver_signer_ids.length !== 1) {
    err.textContent = 'Select exactly one colleague to forward this form to for approval.';
    err.style.display = 'block';
    return;
  }
  const dataUrl = pad.toDataURL('image/png');
  let comments = document.getElementById('rspComments').value.trim();
  if (window.InjaazApprovalComment) {
    comments = window.InjaazApprovalComment.ensureSignedVerifiedComment(comments);
  }
  document.getElementById('rspSubmit').disabled = true;

  try{
    const payload = { signature: dataUrl, comments };
    if (requiresNextApprover) {
      payload.next_approver_signer_id = next_approver_signer_ids[0];
    }
    const res = await fetch('/hr/api/replacement-signoff/'+encodeURIComponent(SUBMISSION_ID)+'/sign', {
      method: 'POST',
      headers:{ 'Authorization':'Bearer '+TOKEN, 'Content-Type':'application/json' },
      body: JSON.stringify(payload)
    });
    const j = await res.json().catch(()=>({}));
    if(!res.ok){
      throw new Error(j.error || 'Unable to submit');
    }
    openHrCenterNotice({
      title: 'Notice',
      message: j.message || 'Saved.',
      onOk: function () { window.location.href = '/hr/my-requests'; },
    });
  } catch(e){
    err.textContent = e.message||'Error';
    err.style.display='block';
    document.getElementById('rspSubmit').disabled = false;
  }
}

boot();
</script>
  <script src="{{ url_for('static', filename='api-client.js') }}"></script>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
