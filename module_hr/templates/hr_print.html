<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>Print - {{ form_title }} - {{ submission_id }}</title>
  <link rel="stylesheet" href="/static/css/hr-forms.css">
  <style>
    @media screen {
      body {
        background: var(--ios-grouped-bg, #f2f2f7);
        padding: 2rem 1rem 3rem;
        min-height: 100vh;
      }
      .print-actions {
        max-width: 920px;
        margin: 0 auto 1.25rem;
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .print-actions button {
        font-family: inherit;
        font-size: 0.9rem;
        cursor: pointer;
        border-radius: 999px;
        padding: 0.7rem 1.35rem;
        font-weight: 600;
        transition: transform 0.15s ease, box-shadow 0.2s ease;
      }
      .print-btn-primary {
        border: none;
        color: #fff;
        background: #d21725;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
      }
      .print-btn-primary:hover {
        transform: none;
        background: #a8121e;
        box-shadow: 0 2px 8px rgba(210, 23, 37, 0.18);
      }
      .print-btn-ghost {
        border: 1.5px solid #dde8e2;
        background: #fff;
        color: #2d4a38;
      }
      .print-btn-ghost:hover {
        border-color: #d21725;
        color: #d21725;
      }
    }
    @media print {
      body { background: white; padding: 0; }
      .print-actions { display: none !important; }
      .doc-form { box-shadow: none !important; border: 1px solid #dde8e2; margin: 0; }
      .doc-header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .doc-panel, .doc-panel--hr { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="print-actions">
    <button type="button" id="printPrimaryBtn" class="print-btn-primary"
      title="{% if pdf_available %}Open print preview with official PDF{% else %}Print or save as PDF{% endif %}">Print</button>
    <button type="button" onclick="window.close()" class="print-btn-ghost">Close</button>
  </div>

  <div class="doc-form doc-form--sheet" style="margin: 0 auto;">
    <div class="doc-header">
      <div class="doc-header-left">
        <p class="doc-company">AMAAN FACILITY MANAGEMENT</p>
        <h1 class="doc-title">{{ form_title }}</h1>
      </div>
      <img src="{{ url_for('static', filename='logo.png') }}" alt="AMAAN" class="doc-logo">
    </div>
    <div class="doc-form-content doc-form-body-premium">
      {{ form_html | safe }}
      {% if doc_no %}
      <div class="doc-footer" style="margin-top: 1.5rem;">
        <span>DOC NO: {{ doc_no }}</span>
        <span>DATE: {{ doc_date }}</span>
        <span>ISSUE: 00</span>
        <span>REVISION: 00</span>
      </div>
      {% endif %}
    </div>
  </div>

  <script>
    (function () {
      var submissionId = {{ submission_id | tojson }};
      var pdfAvailable = {{ pdf_available | tojson }};
      var pdfPrintUrl = '/hr/print-pdf/' + encodeURIComponent(submissionId);

      function openPdfPrintFlow() {
        window.open(pdfPrintUrl, '_blank', 'noopener,noreferrer');
      }

      function doPrintHtml() {
        window.print();
      }

      window.onload = function () {
        if (window.location.search.indexOf('auto=1') !== -1) {
          if (pdfAvailable) {
            window.location.href = pdfPrintUrl;
          } else {
            doPrintHtml();
          }
        }
      };

      var btn = document.getElementById('printPrimaryBtn');
      if (btn) {
        btn.addEventListener('click', function () {
          if (pdfAvailable) {
            openPdfPrintFlow();
          } else {
            doPrintHtml();
          }
        });
      }
    })();
  </script>
</body>
</html>
