<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#ff8e68">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Hiring — Documents · Kynvera</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/kynvera/kynvera-mark-32.png') }}?v=3">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/design-tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='mobile_responsive.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/hr-hiring.css') }}?v=82">
  {% set active_page = 'hr' %}
</head>
<body class="hh-page">
  {% include 'partials/hr_embed_optional_navbar.html' %}

  <div class="hh-shell" id="hhListRoot">
    {% include 'partials/hr_hiring_sidebar.html' %}

    <main class="hh-main">
      <div class="hh-topbar">
        <div>
          <h1 class="hh-title">Hiring — Documents</h1>
          <p class="hh-subtitle">Track onboarding documents for each candidate</p>
        </div>
      </div>

      <div class="hh-toolbar">
        <div class="hh-search">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
          </svg>
          <input type="search" id="hhSearch" placeholder="Search candidates…" autocomplete="off" aria-label="Search candidates">
        </div>
        <div class="hh-filters" role="group" aria-label="Document status filter">
          <button type="button" class="hh-filter-btn active" data-status="all">All</button>
          <button type="button" class="hh-filter-btn" data-status="pending">Pending</button>
          <button type="button" class="hh-filter-btn" data-status="complete">Complete</button>
        </div>
        <select id="hhPipelineFilter" class="hh-select hh-pipeline-filter" aria-label="Pipeline stage filter">
          <option value="all">All stages</option>
          <optgroup label="Stages">
            <option value="interview_completed">Interview completed</option>
            <option value="gathering_documents">Gathering documents</option>
            <option value="preparing_offer_letter">Preparing offer letter</option>
            <option value="offer_letter_prepared">Offer letter prepared</option>
            <option value="offer_letter_signed">Offer letter signed</option>
            <option value="md_signed_offer_received">MD signed offer received</option>
            <option value="visa_process_started">Visa process started</option>
            <option value="candidate_employee">Candidate employed</option>
          </optgroup>
          <optgroup label="Process">
            <option value="on_hold">On hold</option>
          </optgroup>
        </select>
        <div class="hh-excel-actions">
          <button type="button" class="hh-btn hh-btn-secondary hh-btn-sm" id="hhExcelTemplate" title="Download blank Excel template">
            Template
          </button>
          <button type="button" class="hh-btn hh-btn-secondary hh-btn-sm" id="hhExcelExport" title="Export candidates to Excel">
            Export
          </button>
          <button type="button" class="hh-btn hh-btn-secondary hh-btn-sm" id="hhExcelImport" title="Import Excel to create or update candidates">
            Import Excel
          </button>
          <input type="file" id="hhExcelFile" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" hidden>
        </div>
        <button type="button" class="hh-btn hh-btn-primary hh-add-btn hh-add-btn-toolbar" id="hhAddBtnToolbar" aria-label="Add candidate">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
          </svg>
          Add Candidate
        </button>
      </div>

      <div id="hhImportResult" class="hh-import-result" hidden></div>

      <div class="hh-list" id="hhCandidateList">
        <div class="hh-loading"><div class="hh-spinner"></div>Loading candidates…</div>
      </div>
      <div class="hh-pagination" id="hhPagination"></div>
    </main>
  </div>

  {% include 'partials/hr_hiring_candidate_form_modal.html' %}

  <script src="{{ url_for('static', filename='js/injaaz-uae-datetime.js') }}"></script>
  <script src="{{ url_for('static', filename='api-client.js') }}"></script>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
  <script src="{{ url_for('static', filename='js/hr-hiring.js') }}?v=62"></script>
</body>
</html>
