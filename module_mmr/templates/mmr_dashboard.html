<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/design-tokens.css') }}">
  <title>Email Automation – Injaaz</title>
  <link rel="icon" type="image/png" href="/static/logo.png">
  <link rel="stylesheet" href="/static/mobile_responsive.css">
  <link rel="stylesheet" href="/static/animations.css">
  <link rel="stylesheet" href="/static/css/dashboard.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #d21725; --primary-light: #e8323f;
      --text: #111827; --text-muted: #6b7280;
      --bg: #fafafa; --white: #fff; --border: #e5e7eb;
      --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --info: #3b82f6;
      --radius: 10px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
      -webkit-font-smoothing: antialiased; }
    body.ea-page { padding-top: 72px; width: 100%; }
    .ea-wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 80px; }
    .ea-head { display: flex; align-items: center; justify-content: space-between; gap: 16px;
      flex-wrap: wrap; margin-bottom: 22px; }
    .ea-head h1 { font-size: 1.6rem; font-weight: 700; }
    .ea-head p { color: var(--text-muted); font-size: .9rem; margin-top: 4px; }
    .btn { border: none; border-radius: var(--radius); padding: 10px 16px; font-size: .9rem;
      font-weight: 600; cursor: pointer; transition: .15s; display: inline-flex; align-items: center;
      gap: 6px; background: var(--white); color: var(--text); border: 1px solid var(--border); }
    .btn:hover { background: #f3f4f6; }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-light); }
    .btn-danger { color: var(--danger); border-color: #f3c2c2; background: #fff5f5; }
    .btn-danger:hover { background: #fee2e2; }
    .btn-sm { padding: 6px 11px; font-size: .82rem; }
    .ea-card { background: var(--white); border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden; }
    table.ea-table { width: 100%; border-collapse: collapse; }
    .ea-table th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em;
      color: var(--text-muted); padding: 13px 16px; border-bottom: 1px solid var(--border); background: #fafafa; }
    .ea-table td { padding: 14px 16px; border-bottom: 1px solid #f1f1f1; vertical-align: middle; }
    .ea-table tr:last-child td { border-bottom: none; }
    .ea-name { font-weight: 600; }
    .ea-sub { color: var(--text-muted); font-size: .82rem; }
    .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: .72rem;
      font-weight: 600; }
    .badge-on { background: #dcfce7; color: #166534; }
    .badge-off { background: #f3f4f6; color: #6b7280; }
    .badge-success { background: #dcfce7; color: #166534; }
    .badge-failed { background: #fee2e2; color: #991b1b; }
    .badge-never { background: #f3f4f6; color: #6b7280; }
    .row-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; cursor: pointer; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider { position: absolute; inset: 0; background: #cbd5e1; border-radius: 999px; transition: .2s; }
    .switch .slider::before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px;
      background: #fff; border-radius: 50%; transition: .2s; }
    .switch input:checked + .slider { background: var(--success); }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    .ea-empty { padding: 56px 20px; text-align: center; color: var(--text-muted); }
    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(17,24,39,.55); display: none;
      align-items: flex-start; justify-content: center; z-index: 5000; padding: 40px 16px; overflow-y: auto; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 600px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
    .modal-head { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex;
      align-items: center; justify-content: space-between; }
    .modal-head h2 { font-size: 1.15rem; font-weight: 700; }
    .modal-body { padding: 20px 22px; }
    .modal-foot { padding: 16px 22px; border-top: 1px solid var(--border); display: flex; gap: 10px;
      justify-content: flex-end; }
    .field { margin-bottom: 15px; }
    .field label { display: block; font-size: .8rem; font-weight: 600; margin-bottom: 6px; }
    .field input[type=text], .field input[type=number], .field textarea, .field select {
      width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; font-size: .9rem;
      font-family: inherit; background: #fff; }
    .field textarea { resize: vertical; min-height: 90px; }
    .field .hint { font-size: .75rem; color: var(--text-muted); margin-top: 4px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .sched-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .sched-row .field { flex: 1; min-width: 120px; margin-bottom: 0; }
    .attach-list { list-style: none; margin: 8px 0 0; padding: 0; }
    .attach-list li { display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 7px 10px; background: #f9fafb; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; }
    .attach-list .fn { font-size: .85rem; word-break: break-all; }
    .link-x { color: var(--danger); cursor: pointer; font-weight: 700; border: none; background: none; font-size: 1rem; }
    .hidden { display: none !important; }
    #toast-container { position: fixed; top: 84px; right: 18px; z-index: 9999; display: flex;
      flex-direction: column; gap: 8px; }
    .toast { padding: 12px 16px; border-radius: 10px; color: #fff; font-size: .88rem; font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,.18); animation: slideIn .25s; }
    .toast-success { background: var(--success); } .toast-error { background: var(--danger); }
    .toast-info { background: var(--info); }
    @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    @media (max-width: 640px) {
      .ea-table thead { display: none; }
      .ea-table, .ea-table tbody, .ea-table tr, .ea-table td { display: block; width: 100%; }
      .ea-table tr { border-bottom: 8px solid #f3f4f6; }
      .ea-table td { border: none; padding: 6px 16px; }
      .row-actions { justify-content: flex-start; padding-bottom: 14px; }
      .grid2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="ea-page">
  {% include 'partials/main_navbar.html' with context %}

  <div class="ea-wrap">
    <div class="ea-head">
      <div>
        <h1>Email Automation</h1>
        <p>Create scheduled emails — recipients, message, and attachments sent automatically.</p>
      </div>
      <button class="btn btn-primary" onclick="openModal()">+ New automation</button>
    </div>

    <div class="ea-card">
      <table class="ea-table">
        <thead>
          <tr>
            <th>Name</th><th>Schedule</th><th>Recipients</th><th>Last run</th>
            <th>Enabled</th><th style="text-align:right">Actions</th>
          </tr>
        </thead>
        <tbody id="autoBody">
          <tr><td colspan="6" class="ea-empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Create / Edit modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modalTitle">New automation</h2>
        <button class="link-x" onclick="closeModal()" style="font-size:1.4rem">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="fId">
        <div class="field">
          <label>Name</label>
          <input type="text" id="fName" placeholder="e.g. Annual Maintenance – Monthly Report">
        </div>
        <div class="field">
          <label>To (comma-separated @injaaz.ae)</label>
          <input type="text" id="fTo" placeholder="dennis@injaaz.ae, shakeel@injaaz.ae">
        </div>
        <div class="field">
          <label>CC (optional)</label>
          <input type="text" id="fCc" placeholder="finance@injaaz.ae">
        </div>
        <div class="field">
          <label>Subject</label>
          <input type="text" id="fSubject" placeholder="Email subject">
        </div>
        <div class="field">
          <label>Body</label>
          <textarea id="fBody" placeholder="Email message…"></textarea>
        </div>

        <div class="field">
          <label>Schedule</label>
          <div class="sched-row">
            <div class="field">
              <select id="fType" onchange="onTypeChange()">
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly">Monthly</option>
                <option value="quarterly">Quarterly</option>
                <option value="interval">Custom interval</option>
              </select>
            </div>
            <div class="field" id="wrapWeekday">
              <select id="fWeekday">
                <option value="0">Monday</option><option value="1">Tuesday</option>
                <option value="2">Wednesday</option><option value="3">Thursday</option>
                <option value="4">Friday</option><option value="5">Saturday</option>
                <option value="6">Sunday</option>
              </select>
            </div>
            <div class="field" id="wrapDom">
              <input type="number" id="fDom" min="1" max="28" value="1" title="Day of month (1–28)">
            </div>
            <div class="field" id="wrapQstart">
              <select id="fQstart" title="Quarter anchor month">
                <option value="1">Jan, Apr, Jul, Oct</option>
                <option value="2">Feb, May, Aug, Nov</option>
                <option value="3">Mar, Jun, Sep, Dec</option>
              </select>
            </div>
            <div class="field hidden" id="wrapInterval" style="flex:1.4">
              <div style="display:flex;gap:8px">
                <span style="align-self:center;color:var(--text-muted)">Every</span>
                <input type="number" id="fIntN" min="1" max="365" value="1" style="max-width:80px">
                <select id="fIntUnit">
                  <option value="days">days</option>
                  <option value="weeks">weeks</option>
                  <option value="months">months</option>
                </select>
              </div>
            </div>
          </div>
          <div class="sched-row" style="margin-top:12px">
            <div class="field" style="max-width:130px">
              <label>Time (Dubai)</label>
              <input type="time" id="fTime" value="10:00" style="width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px">
            </div>
          </div>
          <div class="hint" id="schedHint" style="margin-top:8px"></div>
        </div>

        <div class="field" id="attachField">
          <label>Attachments</label>
          <div class="hint" id="attachNew">Attachments can be added after the automation is created.</div>
          <input type="file" id="fFile" class="hidden" onchange="uploadAttachment()">
          <button type="button" class="btn btn-sm hidden" id="btnAddAttach" onclick="document.getElementById('fFile').click()">+ Add file</button>
          <ul class="attach-list" id="attachList"></ul>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="btnSave" onclick="saveAutomation()">Save</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- Shared navbar behaviour: user info, menu visibility, mobile drawer, logout, notifications -->
  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

<script>
// ── Auth helper ──────────────────────────────────────────────
async function authFetch(url, opts = {}) {
  const token = localStorage.getItem('access_token');
  const headers = { ...(opts.headers || {}) };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  let resp = await fetch(url, { ...opts, headers });
  if (resp.status === 401) {
    const refresh = localStorage.getItem('refresh_token');
    if (refresh) {
      const r = await fetch('/api/auth/refresh', { method: 'POST', headers: { 'Authorization': `Bearer ${refresh}` } });
      if (r.ok) {
        const d = await r.json();
        if (d.access_token) {
          localStorage.setItem('access_token', d.access_token);
          headers['Authorization'] = `Bearer ${d.access_token}`;
          return fetch(url, { ...opts, headers });
        }
      }
    }
    window.location.href = '/login';
  }
  return resp;
}

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// Safely turn a fetch Response into parsed JSON. Handles the case where the
// server (or a proxy/login redirect/offline shell) returns an HTML page instead
// of JSON — which previously surfaced a raw "Unexpected token '<'" error toast.
async function readJson(resp) {
  // A followed redirect to the login page means the session expired.
  if (resp.redirected && /\/login/i.test(resp.url || '')) {
    window.location.href = '/login';
    throw new Error('Your session has expired. Redirecting to sign in…');
  }
  const ct = resp.headers.get('content-type') || '';
  let data = null;
  if (ct.includes('application/json')) {
    data = await resp.json().catch(() => null);
  }
  if (data === null) {
    // Non-JSON body (HTML error/login page, offline shell, gateway error, …)
    if (resp.status === 401 || resp.status === 403) {
      window.location.href = '/login';
      throw new Error('Please sign in again.');
    }
    throw new Error('Server returned an unexpected response. Please refresh and try again.');
  }
  if (!resp.ok) {
    if (resp.status === 401 || resp.status === 403) {
      window.location.href = '/login';
    }
    throw new Error(data.error || 'Request failed.');
  }
  return data;
}

// ── List ─────────────────────────────────────────────────────
let currentAttachments = [];

async function loadList() {
  const body = document.getElementById('autoBody');
  try {
    const resp = await authFetch('/admin/mmr/api/automations');
    const data = await readJson(resp);
    const rows = data.automations || [];
    if (!rows.length) {
      body.innerHTML = `<tr><td colspan="6" class="ea-empty">No automations yet. Click “New automation” to create one.</td></tr>`;
      return;
    }
    body.innerHTML = rows.map(renderRow).join('');
  } catch (e) {
    body.innerHTML = `<tr><td colspan="6" class="ea-empty">Could not load automations.</td></tr>`;
    toast(e.message, 'error');
  }
}

function lastRunBadge(a) {
  if (!a.last_run_at) return `<span class="badge badge-never">Never</span>`;
  const when = new Date(a.last_run_at + 'Z').toLocaleString();
  const cls = a.last_run_status === 'success' ? 'badge-success' : 'badge-failed';
  return `<span class="badge ${cls}">${esc(a.last_run_status || '—')}</span><div class="ea-sub" title="${esc(a.last_run_detail||'')}">${esc(when)}</div>`;
}

function renderRow(a) {
  return `<tr>
    <td><div class="ea-name">${esc(a.name)}</div><div class="ea-sub">${a.attachments.length} attachment(s)</div></td>
    <td>${esc(a.schedule_summary)}</td>
    <td>${a.recipient_count} recipient(s)</td>
    <td>${lastRunBadge(a)}</td>
    <td><label class="switch"><input type="checkbox" ${a.enabled ? 'checked' : ''} onchange="toggle(${a.id})"><span class="slider"></span></label></td>
    <td><div class="row-actions">
      <button class="btn btn-sm" onclick="runNow(${a.id})">Run now</button>
      <button class="btn btn-sm" onclick="openModal(${a.id})">Edit</button>
      <button class="btn btn-sm btn-danger" onclick="removeAuto(${a.id})">Delete</button>
    </div></td>
  </tr>`;
}

// ── Schedule field visibility + hint ─────────────────────────
function onTypeChange() {
  const t = document.getElementById('fType').value;
  document.getElementById('wrapWeekday').classList.toggle('hidden', t !== 'weekly');
  document.getElementById('wrapDom').classList.toggle('hidden', !(t === 'monthly' || t === 'quarterly'));
  document.getElementById('wrapQstart').classList.toggle('hidden', t !== 'quarterly');
  document.getElementById('wrapInterval').classList.toggle('hidden', t !== 'interval');
  updateHint();
}
function updateHint() {
  const t = document.getElementById('fType').value;
  const time = document.getElementById('fTime').value || '10:00';
  let h = '';
  if (t === 'daily') h = `Runs every day at ${time}.`;
  else if (t === 'weekly') h = `Runs weekly at ${time}.`;
  else if (t === 'monthly') h = `Runs on day ${document.getElementById('fDom').value} each month at ${time}.`;
  else if (t === 'quarterly') h = `Runs every 3 months on day ${document.getElementById('fDom').value} at ${time}.`;
  else if (t === 'interval') h = `Runs every ${document.getElementById('fIntN').value} ${document.getElementById('fIntUnit').value} (12 months = yearly).`;
  document.getElementById('schedHint').textContent = h;
}
['fTime','fDom','fIntN','fIntUnit','fQstart','fWeekday'].forEach(id => {
  document.addEventListener('input', e => { if (e.target.id && ['fTime','fDom','fIntN','fIntUnit'].includes(e.target.id)) updateHint(); });
});

// ── Modal ────────────────────────────────────────────────────
async function openModal(id) {
  document.getElementById('fId').value = id || '';
  document.getElementById('modalTitle').textContent = id ? 'Edit automation' : 'New automation';
  currentAttachments = [];
  // reset
  ['fName','fTo','fCc','fSubject','fBody'].forEach(f => document.getElementById(f).value = '');
  document.getElementById('fType').value = 'daily';
  document.getElementById('fWeekday').value = '0';
  document.getElementById('fDom').value = '1';
  document.getElementById('fQstart').value = '1';
  document.getElementById('fIntN').value = '1';
  document.getElementById('fIntUnit').value = 'days';
  document.getElementById('fTime').value = '10:00';

  const isEdit = !!id;
  document.getElementById('attachNew').classList.toggle('hidden', isEdit);
  document.getElementById('btnAddAttach').classList.toggle('hidden', !isEdit);

  if (isEdit) {
    try {
      const resp = await authFetch(`/admin/mmr/api/automations/${id}`);
      const data = await readJson(resp);
      const a = data.automation;
      document.getElementById('fName').value = a.name || '';
      document.getElementById('fTo').value = a.to_emails || '';
      document.getElementById('fCc').value = a.cc_emails || '';
      document.getElementById('fSubject').value = a.subject || '';
      document.getElementById('fBody').value = a.body || '';
      document.getElementById('fType').value = a.schedule_type || 'daily';
      document.getElementById('fWeekday').value = String(a.weekday ?? 0);
      document.getElementById('fDom').value = String(a.day_of_month ?? 1);
      document.getElementById('fQstart').value = String(a.quarter_start_month ?? 1);
      document.getElementById('fIntN').value = String(a.interval_n ?? 1);
      document.getElementById('fIntUnit').value = a.interval_unit || 'days';
      document.getElementById('fTime').value =
        String(a.hour ?? 10).padStart(2,'0') + ':' + String(a.minute ?? 0).padStart(2,'0');
      currentAttachments = a.attachments || [];
    } catch (e) { toast(e.message || 'Failed to load', 'error'); }
  }
  renderAttachments();
  onTypeChange();
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

function renderAttachments() {
  const ul = document.getElementById('attachList');
  ul.innerHTML = currentAttachments.map(a =>
    `<li><span class="fn">${esc(a.filename)}</span><button class="link-x" onclick="deleteAttachment(${a.id})" title="Remove">&times;</button></li>`
  ).join('');
}

function collectPayload() {
  const [hh, mm] = (document.getElementById('fTime').value || '10:00').split(':');
  return {
    name: document.getElementById('fName').value,
    to_emails: document.getElementById('fTo').value,
    cc_emails: document.getElementById('fCc').value,
    subject: document.getElementById('fSubject').value,
    body: document.getElementById('fBody').value,
    schedule_type: document.getElementById('fType').value,
    hour: parseInt(hh, 10) || 0,
    minute: parseInt(mm, 10) || 0,
    weekday: parseInt(document.getElementById('fWeekday').value, 10),
    day_of_month: parseInt(document.getElementById('fDom').value, 10),
    quarter_start_month: parseInt(document.getElementById('fQstart').value, 10),
    interval_n: parseInt(document.getElementById('fIntN').value, 10),
    interval_unit: document.getElementById('fIntUnit').value,
  };
}

async function saveAutomation() {
  const id = document.getElementById('fId').value;
  const payload = collectPayload();
  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  try {
    const url = id ? `/admin/mmr/api/automations/${id}` : '/admin/mmr/api/automations';
    const resp = await authFetch(url, {
      method: id ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await readJson(resp);
    toast(id ? 'Automation updated' : 'Automation created', 'success');
    if (!id) {
      // re-open in edit mode so attachments can be added
      closeModal();
      await loadList();
      openModal(data.automation.id);
      return;
    }
    closeModal();
    loadList();
  } catch (e) { toast(e.message, 'error'); }
  finally { btn.disabled = false; }
}

async function toggle(id) {
  try {
    const resp = await authFetch(`/admin/mmr/api/automations/${id}/toggle`, { method: 'POST' });
    const data = await readJson(resp);
    toast(data.automation.enabled ? 'Enabled' : 'Disabled', 'success');
  } catch (e) { toast(e.message, 'error'); }
  loadList();
}

async function runNow(id) {
  toast('Sending…', 'info');
  try {
    const resp = await authFetch(`/admin/mmr/api/automations/${id}/run-now`, { method: 'POST' });
    const data = await readJson(resp);
    const st = data.automation.last_run_status;
    toast(st === 'success' ? 'Email sent ✓' : ('Run failed: ' + (data.automation.last_run_detail || '')), st === 'success' ? 'success' : 'error');
  } catch (e) { toast(e.message, 'error'); }
  loadList();
}

async function removeAuto(id) {
  if (!confirm('Delete this automation? This cannot be undone.')) return;
  try {
    const resp = await authFetch(`/admin/mmr/api/automations/${id}`, { method: 'DELETE' });
    await readJson(resp);
    toast('Deleted', 'success');
  } catch (e) { toast(e.message, 'error'); }
  loadList();
}

// ── Attachments ──────────────────────────────────────────────
async function uploadAttachment() {
  const id = document.getElementById('fId').value;
  const input = document.getElementById('fFile');
  if (!id || !input.files[0]) return;
  const fd = new FormData();
  fd.append('file', input.files[0]);
  try {
    const resp = await authFetch(`/admin/mmr/api/automations/${id}/attachments`, { method: 'POST', body: fd });
    const data = await readJson(resp);
    currentAttachments.push(data.attachment);
    renderAttachments();
    toast('Attachment added', 'success');
    loadList();
  } catch (e) { toast(e.message, 'error'); }
  input.value = '';
}

async function deleteAttachment(attId) {
  const id = document.getElementById('fId').value;
  try {
    const resp = await authFetch(`/admin/mmr/api/automations/${id}/attachments/${attId}`, { method: 'DELETE' });
    await readJson(resp);
    currentAttachments = currentAttachments.filter(a => a.id !== attId);
    renderAttachments();
    loadList();
  } catch (e) { toast(e.message, 'error'); }
}

loadList();
</script>
</body>
</html>
