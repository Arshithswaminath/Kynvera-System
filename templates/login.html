<!doctype html>
<html lang="en" class="login-root">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ff8e68" />
    <title>Sign in — Kynvera</title>
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='favicon.png') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/design-tokens.css') }}"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='mobile_responsive.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/login.css') }}"
    />
  </head>
  <body class="login-page">
    <div class="login-page-wrap">
      <a
        href="{{ url_for('index') }}"
        class="page-back-home"
        aria-label="Back to home"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.25"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        Back to home
      </a>

      {% include 'partials/login_shell.html' %}
    </div>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
    <script>
      initLoginShell({ redirect: true });
    </script>
    <script
      src="{{ url_for('static', filename='mobile_utils.js') }}"
      defer
    ></script>
  </body>
</html>
