<!doctype html>
<html lang="en">
<head>
    {% set title = 'Signing Out — Kynvera' %}
    {% include 'partials/auth_head.html' %}
</head>
<body>
    {% from 'partials/auth_shell.html' import auth_shell %}
    {% call auth_shell(form_variant='status') %}
        <div style="margin-bottom: 1.5rem;">
            <img src="{{ url_for('static', filename='images/auth/k-logo-white.png') }}" alt="K." class="auth-logo auth-logo--md" style="margin: 0 auto;">
        </div>
        <div class="auth-status-spinner" aria-hidden="true"></div>
        <h1>Signing you out…</h1>
        <p>You have been logged out securely. Redirecting to the login page.</p>
        <a href="/login" class="auth-status-btn">Sign in again</a>
    {% endcall %}

    <script>
        (function () {
            try {
                // Best-effort client-side cleanup. Server-side cookie clearing has
                // already happened via POST /api/auth/logout when the user clicked
                // the link from the SPA; this just sweeps any residual storage.
                ['access_token', 'refresh_token', 'user'].forEach(function (k) {
                    try { localStorage.removeItem(k); } catch (_) {}
                    try { sessionStorage.removeItem(k); } catch (_) {}
                });
            } catch (e) { /* ignore */ }
            setTimeout(function () { window.location.replace('/login'); }, 1800);
        })();
    </script>
</body>
</html>
