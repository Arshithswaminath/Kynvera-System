<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#d21725">
  <title>Signing Out — Injaaz</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/design-tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='mobile_responsive.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #d21725 0%, #e8323f 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem; color: #1a1a1a;
    }
    .container {
      background: #fff; border-radius: 12px; padding: 2.5rem 1.75rem;
      max-width: 480px; width: 100%; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.12);
    }
    .icon { font-size: 3.25rem; margin-bottom: 0.75rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: #6b6b6b; margin-bottom: 1.5rem; line-height: 1.6; }
    .spinner {
      width: 26px; height: 26px; margin: 0 auto 1.5rem;
      border: 3px solid #e6e6e6; border-top-color: #d21725;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block; padding: 0.875rem 2rem; min-height: 44px;
      background: #d21725; color: #fff; text-decoration: none;
      border-radius: 6px; font-weight: 500;
    }
    .btn:hover { background: #a8121e; }
    @media (max-width: 480px) {
      body { padding: 1rem; }
      .container { padding: 1.75rem 1.25rem; }
      .btn { width: 100%; display: block; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">👋</div>
    <h1>Signing you out…</h1>
    <p>You have been logged out securely. Redirecting to the login page.</p>
    <div class="spinner" aria-hidden="true"></div>
    <a href="/login" class="btn">Sign in again</a>
  </div>
  <script>
    (function () {
      try {
        // Best-effort client-side cleanup. Server-side cookie clearing has
        // already happened via POST /api/auth/logout when the user clicked
        // the link from the SPA; this just sweeps any residual storage.
        ['access_token', 'refresh_token', 'user'].forEach(function (k) {
          try { localStorage.removeItem(k); } catch (_) {}
          try { sessionStorage.removeItem(k); } catch (_) {}
        });
      } catch (e) { /* ignore */ }
      setTimeout(function () { window.location.replace('/login'); }, 1800);
    })();
  </script>
</body>
</html>
