<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#ff8e68">
  <title>Page Not Found — Kynvera</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/design-tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='mobile_responsive.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #ff8e68 0%, #f97e54 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem; color: #1a1a1a;
    }
    .container {
      background: #fff; border-radius: 12px; padding: 2.5rem 1.75rem;
      max-width: 520px; width: 100%; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.12);
    }
    .code { font-size: 4.5rem; font-weight: 800; color: #ff8e68; letter-spacing: -2px; line-height: 1; }
    h1 { font-size: 1.6rem; margin: 0.75rem 0 0.75rem; }
    p { color: #6b6b6b; margin-bottom: 2rem; line-height: 1.6; }
    .btn {
      display: inline-block; padding: 0.875rem 2rem; min-height: 44px;
      background: #ff8e68; color: #fff; text-decoration: none;
      border-radius: 6px; font-weight: 500; transition: all 0.2s ease;
    }
    .btn:hover { background: #e05f36; transform: translateY(-1px); }
    @media (max-width: 480px) {
      body { padding: 1rem; }
      .container { padding: 1.75rem 1.25rem; }
      .code { font-size: 3.5rem; }
      h1 { font-size: 1.35rem; }
      .btn { width: 100%; display: block; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for does not exist or has been moved. Please return to the dashboard and continue from there.</p>
    <a href="/dashboard" class="btn">Return to Dashboard</a>
  </div>
</body>
</html>
