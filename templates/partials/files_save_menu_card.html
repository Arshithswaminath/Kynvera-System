{# Compact Kynvera Files CTA for module sidebars / menus.
   Optional: files_save_label — e.g. "Hiring Documents"
#}
{% set _files_label = files_save_label|default('this module') %}
<div class="files-menu-footer files-menu-footer--sidebar" id="filesSaveSidebarCard" role="region" aria-label="Kynvera Files">
  <div class="files-menu-footer-top">
    <span class="files-menu-footer-icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.9" stroke="currentColor" width="16" height="16">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z"/>
      </svg>
    </span>
    <div class="files-menu-footer-copy">
      <p class="files-menu-footer-title">Kynvera Files</p>
      <p class="files-menu-footer-hint">Keep <span class="files-menu-footer-mod">{{ _files_label }}</span> exports here, then sync to Drive.</p>
    </div>
  </div>
  <div class="files-menu-footer-actions">
    <button type="button" class="files-save-menu-link" id="filesSaveToFilesBtn">Save to Files</button>
    <a class="files-menu-footer-open" href="/files/">Open</a>
  </div>
</div>
