{# Login modal for landing-theme pages. Requires login.css + login.js + landing-auth.js. #}
<div
  class="l-login-modal"
  id="l-login-modal"
  hidden
  role="dialog"
  aria-modal="true"
  aria-labelledby="l-login-modal-title"
>
  <div class="l-login-modal-scrim" data-login-modal-close tabindex="-1"></div>
  <div class="l-login-modal-panel">
    <button
      type="button"
      class="l-login-modal-close"
      data-login-modal-close
      aria-label="Close sign in"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
    <h2 id="l-login-modal-title" class="visually-hidden">Sign in</h2>
    {% include 'partials/login_shell.html' %}
  </div>
</div>
