{# Shared <head> content for the public landing page (light theme). #}
{# Expects: `title` (string) #}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#E8E8E7">
<title>{{ title }}</title>
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/kynvera/kynvera-mark-32.png') }}?v=1">
<link rel="icon" type="image/png" sizes="48x48" href="{{ url_for('static', filename='images/kynvera/kynvera-mark-48.png') }}?v=1">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='images/kynvera/kynvera-mark-180.png') }}?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,400..700&family=Outfit:wght@500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/design-tokens.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='mobile_responsive.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
{% if show_ui_toggle %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/landing-bold.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/landing-motion.css') }}">
<script>
  (function () {
    var forced = {{ (forced_ui or '')|tojson }};
    try {
      var ui = forced || localStorage.getItem('kynvera-landing-ui');
      if (ui === 'bold' || ui === 'motion') {
        document.documentElement.setAttribute('data-landing-ui-boot', ui);
      }
    } catch (e) {}
  })();
</script>
{% endif %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
