<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Opening {{ app_label }} — Kynvera</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: #fff8f5; color: #1a1a1a;
    }
    .box { max-width: 28rem; padding: 2rem; text-align: center; }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    p { margin: 0; color: #555; line-height: 1.5; }
    a { color: #c45c3e; }
    .err { color: #9b1c1c; margin-top: 1rem; }
  </style>
  <script>
    window.__KYNVERA_HUB__ = {{ (hub or {})|tojson }};
    window.__LAUNCH_APP__ = {{ app_key|tojson }};
    window.__LAUNCH_LABEL__ = {{ app_label|tojson }};
    window.__LAUNCH_PATH__ = {{ launch_path|tojson }};
    window.__ACCESS_FLAG__ = {{ access_flag|tojson }};
  </script>
</head>
<body>
  <div class="box" id="launchBox">
    <h1>Opening {{ app_label }}…</h1>
    <p>Signing you through securely.</p>
  </div>
  <script src="{{ url_for('static', filename='js/kynvera-hub.js') }}"></script>
  <script src="{{ url_for('static', filename='js/kynvera-launch.js') }}"></script>
</body>
</html>
