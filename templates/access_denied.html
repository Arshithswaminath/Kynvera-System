<!doctype html>
<html lang="en">
<head>
    {% set title = 'Access Denied - Injaaz Application' %}
    {% include 'partials/auth_head.html' %}
</head>
<body>
    {% from 'partials/auth_shell.html' import auth_shell %}
    {% call auth_shell(form_variant='status') %}
        <div style="margin-bottom: 1.5rem;">
            <img src="{{ url_for('static', filename='images/auth/k-logo-white.png') }}" alt="K." class="auth-logo auth-logo--md" style="margin: 0 auto;">
        </div>
        <div class="auth-status-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>
        <h1>Access Denied</h1>
        <p><strong>{{ module }}</strong><br>{{ message }}</p>
        <a href="/dashboard" class="auth-status-btn">Return to Dashboard</a>
    {% endcall %}
</body>
</html>
