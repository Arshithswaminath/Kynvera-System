# Kynvera Home portal (branch kynvera-main) — landing + auth + launch/SSO only.
# Product apps (Fire / Municipality) are separate Render services on their own branches.
# Pin this Blueprint/service to git branch kynvera-main in the Render dashboard.
# JWT_SECRET_KEY must match the product services for SSO.
services:
  - type: web
    name: kynvera-home
    env: python
    buildCommand: bash build.sh
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-2} --threads 4 --timeout 120 --worker-class gthread
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: WEB_CONCURRENCY
        value: "2"
      - key: KYNVERA_HUB_MODE
        value: "true"
      - key: RUN_MMR_SCHEDULER
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: injaaz-db
          property: connectionString
      - key: KYNVERA_FIRE_APP_URL
        sync: false
      - key: KYNVERA_MUNICIPALITY_APP_URL
        sync: false
      - key: KYNVERA_HOME_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false

databases:
  - name: injaaz-db
    databaseName: injaaz
    user: injaaz_user
